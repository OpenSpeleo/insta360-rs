---
# Adapted from OpenSpeleo/SpeleoDB's Python checks for this native SDK package.
# Prek discovers this project from the repository root and runs it in src-python.
exclude: (^|/)(\.venv|target|dist|__pycache__)/
default_stages: [pre-commit]
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: check-ast
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: prettier markdown
        types_or: [markdown]
        args: [--prose-wrap=always]

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Scan shipped Python and build helpers; tests deliberately exercise exec.
        files: ^(python|scripts)/
        args: [-iii, -ll]
