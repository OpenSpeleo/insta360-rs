---
# Vendor payloads must retain their exact bytes: bundled tests check their hashes.
exclude: ^data/(core|enhancement|underwater-model-a|underwater-model-b|underwater-resources)/assets/
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: prettier markdown
        exclude: ^docs/housing-catalog.md$
        types_or: [markdown]
        args: [--prose-wrap=always]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (workspace)
        entry: cargo fmt --all -- --check
        language: system
        files: (\.rs$|(^|/)(Cargo\.toml|rustfmt\.toml)$)
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (workspace, all features)
        entry: python3 scripts/ci/run-clippy.py
        language: system
        files: (\.rs$|(^|/)Cargo\.(toml|lock)$|pyproject\.toml$|^\.pre-commit-config\.yaml$|^scripts/ci/(run-clippy|build-mnn)\.py$)
        pass_filenames: false
      - id: cargo-machete
        name: cargo machete (unused Rust dependencies)
        entry: cargo machete
        language: system
        files: (^|/)Cargo\.toml$
        pass_filenames: false
