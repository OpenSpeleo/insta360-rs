---
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python scripts/ci/check-release.py

  ci:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml

  crates-io:
    name: Publish Rust crates
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: publish
      - name: Build all three packages and check sizes before authentication
        run: |
          cargo publish --workspace --dry-run --locked
          version="${GITHUB_REF_NAME#v}"
          python scripts/ci/check-packages.py --check-size-only \
            "$CARGO_TARGET_DIR/package/tmp-crate/insta360-rs-$version.crate" \
            "$CARGO_TARGET_DIR/package/tmp-crate/insta360-rs-data-core-$version.crate" \
            "$CARGO_TARGET_DIR/package/tmp-crate/insta360-rs-data-enhancement-$version.crate"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - name: Verify every package, then upload all three in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --workspace --locked

  pypi:
    name: Publish Python package
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/insta360-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - name: Publish verified distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
