---
name: CI
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  ffmpeg-prewarm:
    name: Prepare FFmpeg (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-2025
            target: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Identify the Linux FFmpeg SDK
        if: runner.os == 'Linux'
        id: spec
        run: |
          native_key=$(bash scripts/ci/build-wheel.sh --cache-key)
          echo "cache-key=ffmpeg-linux-sdk-v1-$native_key" >> "$GITHUB_OUTPUT"
      - name: Restore the completed Linux FFmpeg SDK
        if: runner.os == 'Linux'
        id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/ffmpeg-sdk.tar.gz
          key: ${{ steps.spec.outputs.cache-key }}
      - name: Build the Linux FFmpeg SDK on a cache miss
        if: runner.os == 'Linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/build-wheel.sh --prewarm
      - name: Save the completed Linux FFmpeg SDK
        if: runner.os == 'Linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/ffmpeg-sdk.tar.gz
          key: ${{ steps.spec.outputs.cache-key }}
      - name: Report Linux FFmpeg cache use
        if: runner.os == 'Linux'
        env:
          CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.spec.outputs.cache-key }}
        run: |
          if [[ "$CACHE_HIT" == true ]]; then
            echo "FFmpeg SDK restored; native build and package installation skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FFmpeg SDK built after a cache miss." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Cache key: $CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'Linux'
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-native-wheel
        if: runner.os != 'Linux'
      - uses: ./.github/actions/prewarm-native-ffmpeg
        if: runner.os != 'Linux'
        with:
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/ffmpeg-sdk.tar.gz
          if-no-files-found: error
          compression-level: 0

  prek:
    needs: ffmpeg-prewarm
    name: Full prek
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: prek
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-linux-${{ hashFiles('.pre-commit-config.yaml', 'src-python/.pre-commit-config.yaml') }}
      - name: Install tools with cargo-binstall
        run: cargo binstall --no-confirm prek@0.4.14 cargo-machete@0.9.1
      - name: Test release version and package checks
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: prek run --all-files --show-diff-on-failure

  tests:
    name: Tests (${{ matrix.target }})
    needs: [ffmpeg-prewarm, prek]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-2025
            target: windows-x86_64
    env:
      INSTA360_RS_REQUIRE_UNDERWATER_AI: '1'
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-linux
        if: runner.os == 'Linux'
        with:
          cache-key: tests-${{ matrix.target }}
      - uses: ./.github/actions/setup-rust
        if: runner.os != 'Linux'
      - uses: ./.github/actions/setup-native-wheel
        if: runner.os != 'Linux'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os != 'Linux'
        with:
          name: ffmpeg-${{ matrix.target }}
          path: .cache/artifacts
      - name: Configure the prepared native SDK
        if: runner.os != 'Linux'
        shell: bash
        run: |
          tar -xzf .cache/artifacts/ffmpeg-sdk.tar.gz -C .
          python scripts/ci/use-ffmpeg.py
      - uses: ./.github/actions/setup-mnn
        if: runner.os != 'Linux'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.os != 'Linux'
        with:
          key: tests-${{ matrix.target }}
          workspaces: |
            . -> target
            . -> target/wheel-native
      - uses: ./.github/actions/setup-test-tools
        if: runner.os != 'Linux'
      - name: Require Linux software Vulkan execution
        if: runner.os == 'Linux'
        run: echo 'INSTA360_RS_REQUIRE_GPU=1' >> "$GITHUB_ENV"
      - name: Verify fixture prerequisites
        run: python scripts/ci/check-test-tools.py
      - name: All Rust test targets
        run: cargo test --locked --all-targets --all-features
      - name: Rust documentation tests
        run: cargo test --locked --doc --all-features
      - name: Release build (library, CLI, and examples)
        run: cargo build --locked --release --lib --bins --examples --all-features
      - name: Python binding Rust unit tests
        run: cargo test --locked --manifest-path src-python/Cargo.toml --all-targets
      - name: Check isolated features without repeating the complete test suites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for features in '' media gpu cli underwater-ai; do
            cargo check --locked --all-targets --no-default-features --features "$features"
          done
          cargo test --locked --no-default-features --lib ai_capability_fails_before_requesting_resources_without_native_feature
          cargo test --locked --no-default-features --features media --test decoded_layouts unavailable_ai_fails_preflight_and_both_exports_before_creating_outputs
      - name: Check API documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Verify shipped crates and their size limits
        if: runner.os == 'Linux'
        run: python scripts/ci/check-packages.py --all-features
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: rust-crates
          path: dist/crates/*.crate
          if-no-files-found: error
          compression-level: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.os == 'Linux'
        with:
          key: wheel-${{ hashFiles('scripts/ci/*.sh') }}
          workspaces: . -> target/wheel-build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        with:
          path: |
            .cache/wheel/cargo
            .cache/wheel/rustup
            .cache/wheel/mnn-*
          key: wheel-tools-linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci/build-mnn.py') }}
          restore-keys: wheel-tools-linux-
      - name: Restore container paths in the Linux SDK
        if: runner.os == 'Linux'
        # Rust's host setup relocated pkg-config files. The manylinux builder
        # mounts the SDK at /wheel-cache, so restore its original metadata.
        run: tar -xzf .cache/artifacts/ffmpeg-sdk.tar.gz -C .
      - name: Build and repair the Linux wheel from its source distribution
        if: runner.os == 'Linux'
        run: bash scripts/ci/build-wheel.sh
      - name: Build and repair the native wheel from its source distribution
        if: runner.os != 'Linux'
        run: python scripts/ci/build-native-wheel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-dist-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/insta360*.tar.gz
          if-no-files-found: error
      - name: Install the repaired wheel
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: Full Python 3.14 tests against the installed wheel
        run: python -I -X faulthandler src-python/scripts/run-tests.py
      - name: Smoke test without system FFmpeg libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ffmpeg -v error -f lavfi -i color=c=blue:s=32x16:r=5 \
            -t 0.4 -c:v mpeg4 /tmp/fixture.mp4
          PYTHONPATH=src-python/tests python3 - <<'PYTHON'
          from pathlib import Path
          from media_fixtures import v3_tail

          Path("/tmp/fixture.insv").write_bytes(
              Path("/tmp/fixture.mp4").read_bytes() + v3_tail()
          )
          PYTHON
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/scripts/ci:/checks:ro" \
            -v /tmp/fixture.insv:/fixture.insv:ro \
            python:3.10-slim-bookworm \
            sh -ec 'pip install --no-deps /dist/*.whl; python /checks/smoke-wheel.py /fixture.insv'

  python-test:
    name: Python ${{ matrix.python }} installed wheel
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INSTA360_RS_REQUIRE_GPU: '1'
      INSTA360_RS_REQUIRE_UNDERWATER_AI: '1'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-test-dist-linux-x86_64
          path: dist
      - uses: ./.github/actions/setup-test-tools
      - name: Verify fixture prerequisites
        run: python scripts/ci/check-test-tools.py
      - name: Install the built wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Full Python tests against the installed extension
        run: python -I -X faulthandler src-python/scripts/run-tests.py

  trigger-release:
    name: Trigger matching release
    needs: [prek, tests, python-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Fetch tags published while CI was running
        run: git fetch --tags origin
      - name: Dispatch release for the tested workspace-version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python scripts/ci/check-release.py --matching-tag)
          if [ -z "$tag" ]; then
            echo "No workspace-version tag on the tested commit; skipping release."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" \
            -f ci_run_id="$GITHUB_RUN_ID" -f ci_run_attempt="$GITHUB_RUN_ATTEMPT"
