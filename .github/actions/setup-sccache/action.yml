---
name: Set up Rust and native compiler cache
description: Cache Rust, C/C++, assembly and Metal compilation with sccache and Ninja
runs:
  using: composite
  steps:
    - name: Read the selected Python version
      id: python
      shell: bash
      env:
        CACHE_ACTION_PATH: ${{ github.action_path }}
      run: |
        python - <<'PYTHON' >> "$GITHUB_OUTPUT"
        import os
        from pathlib import Path
        import platform

        action = Path(os.environ['CACHE_ACTION_PATH']).resolve()
        sdk = action.parents[2]
        print('version=' + platform.python_version())
        print('requirements=' + (sdk / 'scripts/ci/requirements-wheel.txt').as_posix())
        print('action=' + (action / 'action.yml').as_posix())
        PYTHON
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ steps.python.outputs.version }}
        cache: pip
        cache-dependency-path: |
          ${{ steps.python.outputs.requirements }}
          ${{ steps.python.outputs.action }}
    - name: Install Ninja for cached native builds
      shell: bash
      run: python -m pip install ninja==1.13.0
    - name: Configure compiler cache paths
      shell: bash
      env:
        CACHE_ACTION_PATH: ${{ github.action_path }}
      run: |
        python - <<'PYTHON'
        import os
        from pathlib import Path

        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        sdk = Path(os.environ["CACHE_ACTION_PATH"]).resolve().parents[2]
        cache = workspace / ".cache/sccache"
        cache.mkdir(parents=True, exist_ok=True)
        values = {
            "INSTA360_SCCACHE_ROOT": str(cache),
            "RUSTC_WRAPPER": "sccache",
            "CARGO_INCREMENTAL": "0",
            "SCCACHE_DIR": str(cache / "host"),
            "SCCACHE_CACHE_SIZE": "1G",
            "SCCACHE_DIRECT": "false",
            "SCCACHE_GHA_ENABLED": "true",
            "SCCACHE_BASEDIRS": os.pathsep.join([str(workspace), os.environ["RUNNER_TEMP"]]),
            "CMAKE_GENERATOR": "Ninja",
            "CMAKE_TOOLCHAIN_FILE": str(sdk / "scripts/ci/sccache.cmake"),
        }
        with open(os.environ["GITHUB_ENV"], "a") as output:
            for key, value in values.items():
                print(f"{key}={value}", file=output)
        PYTHON
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
        disable_annotations: true
    - name: Start compiler cache
      shell: bash
      run: sccache --start-server
