---
name: Set up pinned Rust
description: Install the exact compiler and components from rust-toolchain.toml
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: scripts/ci/requirements-wheel.txt
    - name: Read the repository toolchain
      id: toolchain
      shell: bash
      run: |
        python - <<'PY'
        import os
        import tomllib
        from pathlib import Path
        config = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print(f"channel={config['channel']}", file=output)
            print(f"components={','.join(config.get('components', []))}", file=output)
        with open(os.environ["GITHUB_ENV"], "a") as output:
            print(f"RUSTUP_TOOLCHAIN={config['channel']}", file=output)
        PY
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ steps.toolchain.outputs.components }}
    - name: Verify selected toolchain
      shell: bash
      run: rustup show active-toolchain
